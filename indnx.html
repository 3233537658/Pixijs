<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spine Animation</title>
    <script src="./js/pixi.min.js"></script>
    <script src="./js/pixi-spine.umd.min.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-spine@3.1.1/dist/pixi-spine.umd.min.js"></script> -->
</head>

<body>

    <div id="app"></div>
    <script>
        const app = new PIXI.Application({
            backgroundColor: 0xFFFFFF,
            antialias: true,
            width: document.documentElement.clientWidth,
            height: document.documentElement.clientHeight
        });
        document.getElementById('app').appendChild(app.view);//div
        let loader = PIXI.Loader.shared.add('ordylan', `./atlases/atlases.json`);//OD.json你的json
        let ordylan = null;
        let animationNames = [];


        function Lnitialize(ordylan) {

            // 获取Spine模型原始长宽
            var skinwidth = ordylan.spineData.width;
            var skinheight = ordylan.spineData.height;
            console.log('模型原始长宽:', skinwidth, skinheight);

            var beishu1 = document.getElementById('app').clientWidth / skinwidth;
            var beishu2 = document.getElementById('app').clientHeight / skinheight;
            if (beishu1 > beishu2) {
                var beishu = beishu2;
            }
            else if (beishu1 == beishu2) {
                var beishu = beishu1;
            }
            else if (beishu1 < beishu2) {
                var beishu = beishu1;
            }

            // 获取缩放后实际渲染的长宽
            var renderWidth = skinwidth * beishu;
            var renderHeight = skinheight * beishu;
            console.log('模型实际渲染长宽:', renderWidth, renderHeight);

            ordylan.x = skinwidth * beishu / 2;//O点在中间,所以xy 坐标 长宽除以二(导出记得把动画放在中央)
            ordylan.y = skinheight * beishu / 2;
            ordylan.scale.set(beishu);//放大倍数
        }

        loader.load((loader, res) => {
            ordylan = new PIXI.spine.Spine(loader.resources.ordylan.spineData);
            Lnitialize(ordylan);
            // 获取并输出所有动画名称
            animationNames = loader.resources.ordylan.spineData.animations.map(anim => anim.name);
            console.log('所有动画名称:', animationNames);

            ordylan.state.setAnimation(0, animationNames[0], true);//loop你的动画名字 true 为循环播放  pose

            app.stage.addChild(ordylan);
        });

        // 设置舞台的交互属性为true，使其可以接收交互事件
        app.stage.interactive = true;
        app.stage.hitArea = app.screen;

        let shu = 0;
        // 添加点击事件监听
        app.stage.on('pointerdown', (event) => {
            shu++;
            if (shu >= animationNames.length) {
                shu = 0;
            }
            ordylan.state.setAnimation(0, animationNames[shu], true);
        });

    </script>
</body>

</html>
